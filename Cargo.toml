[workspace]
resolver = "2"
members = ["core", "cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/elie-laloum/orama"

[workspace.dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "stream",
  "gzip",
  "brotli",
  "deflate",
  "zstd",
] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Editing a user's config.toml in place: preserves their comments, key order
# and formatting, so connecting a harness is a surgical edit rather than a
# rewrite of a file that is theirs, not ours.
toml_edit = "0.22"
# Request bodies arrive compressed — Codex sends `content-encoding: zstd`.
# Already in the tree via reqwest's response decoding; declared directly so the
# capture path can decode too, since a stored body has to be parseable.
zstd = "0.13"
flate2 = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"
bytes = "1"
http = "1"
futures = "0.3"
async-stream = "0.3"
rusqlite = { version = "0.31", features = ["bundled"] }
blake3 = "1"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
